[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runearc"
version = "0.1.0"
description = "Official Runearc SDK for Python: send and schedule email, read agent inboxes, manage domains, verify webhooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["email", "email-api", "transactional-email", "smtp", "inbox", "webhooks", "ai-agents", "mcp", "resend-compatible"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.urls]
Homepage = "https://runearc.com/integrations/python"
Documentation = "https://runearc.com/docs/sdk"
Repository = "https://github.com/runearc-labs/runearc-python"
Issues = "https://github.com/runearc-labs/runearc-python/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/runearc"]

[tool.hatch.build.targets.sdist]
include = ["src/runearc", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PT"]
# typing.Optional, List and Dict keep type aliases importable on Python 3.9.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
